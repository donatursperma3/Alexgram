name: Build Telegram APK

# Run on push to main/dev and manually
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'alpha*'
      - 'fix-**'
      - 'feat-**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # LOCAL_PROPERTIES should contain base64(local.properties)
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      TELEGRAM_APP_ID: ${{ secrets.APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.APP_HASH }}
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle # Mempercepat build dengan cache

      # 3. Berikan izin eksekusi pada gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Menyiapkan Android SDK dan paket terkait agar Gradle dapat membangun proyek
      # (build-tools, NDK, dan platform yang diperlukan)
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 cmake;3.31.6 ndk;27.2.12479018 platforms;android-36"

      - name: Configure Android SDK Path
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          mkdir -p "$ANDROID_SDK_ROOT"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Configuring gradle.properties for CI"
          echo "org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512M -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "kotlin.incremental=false" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "ksp.incremental.intermodule=false" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties

      - name: Decode google-services.json (optional)
        run: |
          if [ ! -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "Decoding google-services.json from secrets"
            echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > TMessagesProj/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON provided; skipping"
          fi

      - name: Prepare LOCAL_PROPERTIES (optional)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          if [ ! -z "${LOCAL_PROPERTIES}" ]; then
            echo "Writing local.properties from LOCAL_PROPERTIES secret"
            echo "${LOCAL_PROPERTIES}" | base64 --decode > local.properties
            sed -i '/^sdk.dir=/d' local.properties || true
            echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          else
            echo "No LOCAL_PROPERTIES secret provided; Gradle will fallback to project local.properties if present"
          fi

      # Jalankan task Gradle yang sesuai berdasarkan branch
      # - main -> assembleRelease
      # - dev  -> assembleStaging
      # - lainnya -> assembleDebug
      - name: Clean build artifacts
        run: ./gradlew clean --no-daemon --no-build-cache --max-workers=1 --console=plain

      - name: Build APK (select task by branch)
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          export ENABLE_ABI_SPLITS="${ENABLE_ABI_SPLITS:-false}"
          echo "Building on branch: ${GIT_REF_NAME}"
          echo "ENABLE_ABI_SPLITS=${ENABLE_ABI_SPLITS}"
          java -version
          free -h || true
          df -h . || true
          if [ "${GIT_REF_NAME}" = "main" ]; then
            ./gradlew TMessagesProj:assembleRelease --no-daemon --no-build-cache --max-workers=1 --console=plain --stacktrace --info
          elif [ "${GIT_REF_NAME}" = "dev" ]; then
            ./gradlew TMessagesProj:assembleStaging --no-daemon --no-build-cache --max-workers=1 --console=plain --stacktrace --info
          else
            ./gradlew TMessagesProj:assembleDebug --no-daemon --no-build-cache --max-workers=1 --console=plain --stacktrace --info
          fi

      - name: Prepare artifact name
        id: artifact_name
        run: |
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "name=Alexgram-${BRANCH_SAFE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # Upload APK split per ABI sebagai artifact agar ukuran unduhan lebih kecil dan file lebih terpisah
      - name: Upload Split APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/*/*/*.apk
          if-no-files-found: error
          retention-days: 7000 # APK akan dihapus dari server GitHub setelah 7000 hari

      - name: Collect build diagnostics on failure
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          cp -R build/reports ci-diagnostics/root-reports 2>/dev/null || true
          cp -R TMessagesProj/build/reports ci-diagnostics/project-reports 2>/dev/null || true
          cp -R TMessagesProj/build/outputs/logs ci-diagnostics/output-logs 2>/dev/null || true
          cp "$HOME"/.gradle/daemon/*/*.log ci-diagnostics/ 2>/dev/null || true
          cp hs_err_pid*.log ci-diagnostics/ 2>/dev/null || true

      - name: Upload build diagnostics on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Alexgram-build-diagnostics-${{ github.run_id }}
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14
