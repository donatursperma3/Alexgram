name: Build Telegram APK

# Kapan workflow ini dijalankan
on:
  # Berjalan manual dari tab Actions di GitHub (Sangat disarankan)
  workflow_dispatch:
  # Berjalan otomatis saat ada push ke branch tertentu (opsional)
  push:
    branches:
      - master
      - 'fix-**'
      - 'feat-**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java (Telegram fork modern biasanya butuh JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle # Mempercepat build dengan cache

      # 3. Berikan izin eksekusi pada gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. (PENTING) Decode google-services.json dari GitHub Secrets
      # Jika build Anda tidak butuh file ini, Anda bisa menghapus step ini
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Membuat google-services.json dari secrets..."
            echo $GOOGLE_SERVICES_JSON | base64 --decode > TMessagesProj/google-services.json
          else
            echo "Secret tidak ditemukan, melewati step ini."
          fi

      # 5. Bersihkan dan Build APK
      # Catatan: Telegram biasanya menggunakan flavor 'afat'. Jika gagal, coba ganti 'assembleRelease' dengan 'assembleAfat'
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      # 6. Upload APK sebagai Artifact (Agar bisa didownload)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alexgram-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
          retention-days: 7000 # APK akan dihapus dari server GitHub setelah 7000 hari