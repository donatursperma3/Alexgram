buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath 'com.chaquo.python:gradle:17.0.0'
    }
}

plugins {
    id 'com.google.devtools.ksp' apply false
    id 'com.google.gms.google-services' apply false
    id 'com.google.firebase.crashlytics' apply false
    id 'com.google.dagger.hilt.android' apply false
    id 'org.jetbrains.kotlin.plugin.compose' apply false
}

// Lock Kotlin standard library versions across all subprojects to match
// the Kotlin compiler plugin (2.1.10). Prevents newer transitive stdlib
// (e.g. 2.3.0 pulled by Compose BOM) from causing "incompatible metadata"
// errors during ksp/kotlin compilation.
def kotlinVersion = '2.1.10'
ext {
    kotlinVersion = kotlinVersion
}
allprojects {
    configurations.all { config ->
        def kotlinArtifacts = [
            "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-stdlib-common:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-test:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-test-common:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-test-junit:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-test-junit5:${kotlinVersion}"
        ]
        try {
            config.resolutionStrategy.force(kotlinArtifacts)
        } catch (Exception ignored) {
        }

        try {
            config.resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name.startsWith('kotlin-')) {
                    if (details.requested.version != null
                        && details.requested.version != kotlinVersion) {
                        details.useVersion kotlinVersion
                        details.because("Kotlin stdlib must match compiler plugin version ${kotlinVersion} to avoid metadata incompatibility")
                    }
                }
            }
        } catch (Exception ignored2) {
        }
    }
}

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin("com.android.library") || plugins.hasPlugin("com.android.application")) {
            android {
                compileSdk = 36
                buildToolsVersion = "36.0.0"
                ndkVersion = "27.2.12479018"

                lint {
                    checkReleaseBuilds = false
                    disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi'
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17

                    coreLibraryDesugaringEnabled = true
                }

                defaultConfig {
                    minSdk = 27
                    targetSdk = 35
                }

                buildFeatures.buildConfig = true
            }
        }

        if (plugins.hasPlugin("com.google.devtools.ksp")) {
            ksp {
                arg('ksp.incremental', providers.gradleProperty('ksp.incremental').orElse('true').get())
                arg('ksp.incremental.intermodule', providers.gradleProperty('ksp.incremental.intermodule').orElse('true').get())
            }
        }

        tasks.withType(com.google.devtools.ksp.gradle.KspTask).configureEach {
            it.enabled = true
        }
    }
}
