import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.10' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id 'com.google.firebase.crashlytics' version '3.0.6' apply false
    id 'com.google.dagger.hilt.android' version '2.57.2' apply false
    id 'com.google.devtools.ksp' version '2.1.10-1.0.31' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.10' apply false
    id 'com.chaquo.python' version '17.0.0' apply false
}

// Lock Kotlin standard library versions across all subprojects to match
// the Kotlin compiler plugin (2.1.10). Prevents newer transitive stdlib
// (e.g. 2.3.0 pulled by Compose BOM) from causing "incompatible metadata"
// errors during ksp/kotlin compilation.
//
// NOTE: settings.gradle already registers a `gradle.beforeProject` hook that
// applies the same force rules EARLIER (before project buildscripts run).
// The block below is a redundant safety-net layer that fires during project
// evaluation, catching any edge-case configurations that somehow escaped
// the settings-level hook.
def kotlinVersion = '2.1.10'
ext {
    kotlinVersion = kotlinVersion
}
allprojects {
    // Use `all` (not `configureEach`) so rules are registered for BOTH
    // existing configurations AND configurations that plugins create later
    // (e.g. kspDebugKotlinClasspath, kotlinCompilerClasspath).
    configurations.all { config ->
        // Strongest mechanism: force the exact version for all Kotlin libs.
        def kotlinArtifacts = [
            "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-stdlib-common:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-test:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-test-common:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-test-junit:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-test-junit5:${kotlinVersion}"
        ]
        try {
            config.resolutionStrategy.force(kotlinArtifacts)
        } catch (Exception ignored) {
            // Some configurations (e.g. detached, plugin classpath, locked)
            // do not support force(). Silently skip; settings-level hook covers.
        }

        // Second layer: catch any other org.jetbrains.kotlin:* artifact
        // (kotlin-android-extensions, kotlin-compiler-embeddable, etc.)
        try {
            config.resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name.startsWith('kotlin-')) {
                    if (details.requested.version != null
                        && details.requested.version != kotlinVersion) {
                        details.useVersion kotlinVersion
                        details.because("Kotlin stdlib must match compiler plugin version ${kotlinVersion} to avoid metadata incompatibility")
                    }
                }
            }
        } catch (Exception ignored2) {
            // eachDependency unsupported on this config; skip silently
        }
    }
}

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin("com.android.library") || plugins.hasPlugin("com.android.application")) {
            android {
                compileSdk = 36
                buildToolsVersion = "36.0.0"
                ndkVersion = "27.2.12479018"

                lint {
                    checkReleaseBuilds = false
                    disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi'
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17

                    coreLibraryDesugaringEnabled = true
                }

                defaultConfig {
                    minSdk = 27
                    targetSdk = 36
                }

                buildFeatures.buildConfig = true
            }
        }

        if (plugins.hasPlugin("com.google.devtools.ksp")) {
            ksp {
                arg('ksp.incremental', providers.gradleProperty('ksp.incremental').orElse('true').get())
                arg('ksp.incremental.intermodule', providers.gradleProperty('ksp.incremental.intermodule').orElse('true').get())
            }
        }

        // Disable parallel execution for KSP and D8 tasks to reduce memory pressure
        tasks.withType(com.google.devtools.ksp.gradle.KspTask).configureEach {
            it.enabled = true
        }
    }
}
